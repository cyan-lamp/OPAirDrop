# compileSdk 37 is Android 17, which AGP 8.9.0 predates — it therefore warns that the platform
# is newer than the plugin. The warning is about the plugin's age, not about anything this app
# does; suppressing it is the honest alternative to downgrading the app to a platform that can
# no longer be downloaded.
android.suppressUnsupportedCompileSdk=37

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Required only because the module compiles against `androidx.recyclerview`, which OShare
# already ships: the panel hook wraps OShare's device list, and writing that wrapper against
# a hand-rolled stub of RecyclerView would be a stub that silently drifts from the class it
# stands in for. Nothing androidx is packaged into this APK — both dependencies are
# `compileOnly` — so the flag changes the build's dependency rules, not the app's contents.
android.useAndroidX=true
