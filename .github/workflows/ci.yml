# 评审 P1-23：最小的自动化门禁。每一项都是本地已在跑的检查，CI 只是让它们
# "不得不跑"——跑不过的 PR 进不了 main。
#
# 环境说明：
# - ubuntu-latest 自带 JDK 与 Android SDK；NDK 用 nttld/setup-ndk 钉到 r27c
#   （.cargo/config.toml 已不写死 linker 路径，见评审 P1-21）。
# - `local.properties` 不在仓库里（P1-21），Gradle 从 ANDROID_HOME 找 SDK。
# - check.sh 需要一个 JVM 跑 Java 胶水层的往返——setup-java 的 JDK 17 同时喂它。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 SDK 组件（platform 37 / build-tools 37 / NDK r27.3，全部钉版本）
        run: |
          # android-37 平台在 sdkmanager 的仓库里以 minor 级目录（platform-37.2_r02.zip）
          # 发布，按名字装会 "Failed to find package"。直接下官方 zip 解到 platforms/ 并
          # 改名 android-37——与本机 tools/android-sdk 的手工步骤一致（评审 P1-25）。
          curl -fsSLO https://dl.google.com/android/repository/platform-37.2_r02.zip
          unzip -q platform-37.2_r02.zip -d "$ANDROID_HOME/platforms/"
          d=$(find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -name 'android-37*' | head -1)
          [ "$d" != "$ANDROID_HOME/platforms/android-37" ] && mv "$d" "$ANDROID_HOME/platforms/android-37"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "build-tools;37.0.0" "ndk;27.3.13750724" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: clippy（0 警告门禁）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: 交叉 check（aarch64-android，不链接）
        run: cargo check --workspace --target aarch64-linux-android

      - name: 载荷哈希校验
        run: ./tools/verify-payload.sh

      - name: JVM 往返（394 条）
        run: bash crates/ffi/jvm/check.sh

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0
      - name: 组装 APK（android/build.sh：cargo + gradle 一条龙）
        run: bash android/build.sh assembleDebug

      - name: APK 必须带着 .so
        run: |
          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          unzip -l "$apk" | grep -E 'lib/.*/libopairdrop_ffi\.so'
