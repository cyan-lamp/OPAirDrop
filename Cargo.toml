[workspace]
resolver = "2"
members = [
    "crates/airdrop",
    "crates/bplist",
    "crates/cpio",
    "crates/ffi",
    "crates/http",
    "crates/mdns",
    "crates/settings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-2.0-only"
repository = "https://github.com/opairdrop/opairdrop"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
