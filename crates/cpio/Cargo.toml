[package]
name = "opairdrop-cpio"
description = "cpio (newc/odc) and DVZip codecs for the AirDrop /Upload payload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# miniz_oxide backend: pure Rust, so the crate builds without a C toolchain and
# cross-compiles to Android targets with nothing but `rustup target add`.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# 评审 P1-23：解析器吃不可信字节，属性测试（往返恒等 + 任意字节不 panic）
# 是 fuzz 的稳定工具链替身——stable 就能跑，直接进 cargo test / CI。
proptest = "~1.5"
